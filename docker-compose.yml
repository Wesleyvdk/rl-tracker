name: rl-tracker
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${RL_TRACKER_BASE_IMAGE:-oven/bun:1.3.8}
    container_name: rl-tracker-bot
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    env_file:
      - .env
    environment:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      DATABASE_PATH: /app/data/database.sqlite
    volumes:
      - sqlite_data:/app/data
    shm_size: "256mb"

volumes:
  sqlite_data:
